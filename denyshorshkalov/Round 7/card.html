<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Card</title>
    <style>

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #c8d7ed;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 300px;
      padding: 24px;
      background-color: #ffffff;
      border: 1px solid #db5454;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .card-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }

    .card h2 {
      margin: 8px 0;
      color: #1a1a1a;
    }

    .card p {
      margin: 0 0 20px 0;
      color: #666666;
      font-size: 14px;
    }

    .links-row {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .links-row a {
      text-decoration: none;
      color: #2563eb;
      padding: 8px 12px;
      border-radius: 6px;
      background-color: #eff6ff;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s, color 0.2s;
    }

    .links-row a:hover {
      background-color: #2563eb;
      color: #ffffff;                
    }
  </style>
</head>
<body>
   <div class="card">
    <img src="avatar.jpeg" alt="foto" class="card-img">
    <h2>Denys Horshkalov</h2>
    <p>Operations manager</p>
    
    <div class="links-row">
      <a href="https://github.com/DenGor911" target="_blank">GitHub</a>
      <a href="https://www.linkedin.com/in/denys-horshkalov-445b4668" target="_blank" >LinkedIn</a>
      <a href="https://www.t.me/Gorshkalov" target="_blank">Telegram</a>
    </div>
  </div>
</body>
</html>
